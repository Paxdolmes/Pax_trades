name: Web version

# Builds the web version of both apps and publishes it on GitHub Pages:
# Relay at https://app.relay-trade.co.uk and Relay Traders at /traders.
# Runs on every merge to main, or by hand from the Actions tab.
# One-off setup (see docs/going-live.md, section 6): Settings > Pages > Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths: [mobile/**, .github/workflows/web.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      # Public keys (they ship inside the apps); same values as eas.json.
      EXPO_PUBLIC_SUPABASE_URL: https://qfpujvfopbgnslylsquf.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_vfPGYV-jWYc57cfp4R9O6w_G1AGAOJY
      EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_51UUpDpLVTr8AUM8RqZNsk2vgzo9TnaruzC97ZBsqHO2vnAgqkmpEJxHvWopO9ZpFhSqXFQLcM8Jhwamc1w0WY1oo00bNp3Echt
      # Served from the root of the custom domain.
      WEB_BASE: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      # A headless browser copies each page's text into its HTML for search engines (scripts/build-web.mjs).
      - run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: npm run build:web
      - run: echo app.relay-trade.co.uk > dist-web/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
